name: CI

# Security posture of this workflow:
# - `pull_request` (never `pull_request_target`) is used, so untrusted pull request code is
#   executed in the untrusted context without access to repository secrets.
# - `contents: read` is the only permission granted; the workflow never writes to the repository.
# - No secrets are used and there is no publishing or deployment step.
# - The only third party actions used are actions/checkout (MIT) and actions/setup-java (MIT).
#   `gradle/actions/setup-gradle` is deliberately not used because that repository also bundles a
#   proprietary component under a separate licence.
#
# Scope of this workflow:
# It builds the mod and runs the JUnit test suite on Windows, Linux and macOS.
# It never launches the Minecraft client or the dedicated server, so it says nothing about
# whether the game runs on a platform. The game runs are validated manually.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (${{ matrix.os }}, Java 21)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      # Report the result of every operating system, even when another one fails.
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        # The Gradle project configuration is operating system neutral. Only the invocation of
        # the wrapper differs: Windows uses the batch script, Linux and macOS the shell script.
        # Each entry matches one `os` value above, so every job gets exactly one command.
        include:
          - os: ubuntu-latest
            gradle_command: './gradlew --no-daemon build'
          - os: windows-latest
            gradle_command: '.\gradlew.bat --no-daemon build'
          - os: macos-latest
            gradle_command: './gradlew --no-daemon build'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # `build` compiles the mod and runs the JUnit test suite in `src/test/java`.
      # GitHub Actions sets the CI environment variable, which makes ModDevGradle use its binary
      # artifact pipeline instead of decompiling Minecraft; that keeps the job within the timeout.
      - name: Build and test with Gradle
        run: ${{ matrix.gradle_command }}
