# Gradle JVM settings for this project only (does not change machine defaults).
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Parchment parameter names / Javadoc for Minecraft sources.
# Data licence: CC0-1.0 (https://github.com/ParchmentMC/Parchment/blob/master/LICENSE.txt).
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Environment properties.
# The Minecraft version must agree with the NeoForge version to get a valid artifact.
minecraft_version=1.21.1
# The Minecraft version range can use any release version of Minecraft as bounds.
minecraft_version_range=[1.21.1,1.22)
# The NeoForge version must agree with the Minecraft version to get a valid artifact.
# NeoForge 21.1.x is the 1.21.1 line (LGPL-2.1).
neo_version=21.1.265
# The NeoForge version range can use any version of NeoForge as bounds.
neo_version_range=[21.1,)
# The loader version range can only use the major version of FML as bounds.
loader_version_range=[4,)

## Mod properties

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}.
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=racmc
# The human-readable display name for the mod.
# This is the canonical name of the project and of the mod, approved by the project owner.
mod_name=Ratchet & Clank: Getting Wood
# The license of the mod.
# The project owner selected the MIT licence for the source code of this project. It covers the
# source code only and grants no rights to the original Ratchet & Clank assets, which are not
# part of this repository. The full text is in the LICENSE file.
mod_license=MIT
# The mod version. See https://semver.org/
mod_version=0.1.0
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
# This matches the base package used for the mod sources.
mod_group_id=com.github.giannigr.racmc
# The authors of the mod. This is a simple text string that is used for display purposes in the mod list.
mod_authors=GianniGr
