// Opt-in, isolated, two-process GameTest fixture. No player world or original assets.
allprojects {
    afterEvaluate {
        if (!project.hasProperty('boltRestartDirectory')) {
            throw new GradleException('Supply -PboltRestartDirectory=<absolute private directory outside Git>')
        }
        def directory = file(project.property('boltRestartDirectory'))
        def fixture = new File(directory, 'resources/data/racmc_restart/structure/empty.nbt')
        sourceSets.main.resources.srcDir(new File(directory, 'resources'))
        tasks.register('generateBoltRestartFixture') {
            outputs.file(fixture)
            doLast {
                fixture.parentFile.mkdirs()
                // Original synthetic empty 5x5x5 structure: standard NBT, not game asset bytes.
                new DataOutputStream(new java.util.zip.GZIPOutputStream(new FileOutputStream(fixture))).withCloseable { out ->
                    out.writeByte(10); out.writeUTF('')
                    out.writeByte(3); out.writeUTF('DataVersion'); out.writeInt(3955)
                    out.writeByte(9); out.writeUTF('size'); out.writeByte(3); out.writeInt(3)
                    out.writeInt(5); out.writeInt(5); out.writeInt(5)
                    out.writeByte(9); out.writeUTF('palette'); out.writeByte(10); out.writeInt(1)
                    out.writeByte(8); out.writeUTF('Name'); out.writeUTF('minecraft:air'); out.writeByte(0)
                    out.writeByte(9); out.writeUTF('blocks'); out.writeByte(10); out.writeInt(0)
                    out.writeByte(9); out.writeUTF('entities'); out.writeByte(10); out.writeInt(0)
                    out.writeByte(0)
                }
            }
        }
        tasks.named('processResources') { dependsOn('generateBoltRestartFixture') }
        neoForge.runs.gameTestServer.gameDirectory = new File(directory, 'runtime')
        neoForge.runs.gameTestServer.systemProperty('neoforge.enabledGameTestNamespaces', 'racmc_restart')
        neoForge.runs.gameTestServer.systemProperty('racmc.boltRestartMarker', new File(directory, 'restart-marker.nbt').absolutePath)
        neoForge.runs.gameTestServer.systemProperty('racmc.boltRestartStage', project.findProperty('boltRestartStage') ?: '')
    }
}
