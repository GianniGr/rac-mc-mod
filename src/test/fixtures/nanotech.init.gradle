// Explicit opt-in only: synthetic fixture classes/resources never enter normal publication outputs.
allprojects {
    afterEvaluate {
        if (!project.hasProperty('nanotechDirectory'))
            throw new GradleException('Supply private -PnanotechDirectory')
        def directory = file(project.property('nanotechDirectory'))
        layout.buildDirectory = new File(directory, 'build')
        sourceSets.main.java.srcDir(new File(project.projectDir, 'src/test/fixtures/nanotech/java'))
        sourceSets.main.output.classesDirs.setFrom(new File(directory, 'build/classes/java/main'))
        tasks.named('compileJava') { destinationDirectory = new File(directory, 'build/classes/java/main') }
        tasks.named('processResources') { destinationDir = new File(directory, 'build/resources/main') }
        sourceSets.main.output.resourcesDir = new File(directory, 'build/resources/main')
        sourceSets.main.resources.srcDir(new File(directory, 'resources'))
        def fixture = new File(directory, 'resources/data/racmc_nanotech/structure/empty.nbt')
        tasks.register('generateNanotechFixture') {
            outputs.file(fixture)
            doLast {
                fixture.parentFile.mkdirs()
                new DataOutputStream(new java.util.zip.GZIPOutputStream(new FileOutputStream(fixture))).withCloseable { out ->
                    out.writeByte(10); out.writeUTF('')
                    out.writeByte(3); out.writeUTF('DataVersion'); out.writeInt(3955)
                    out.writeByte(9); out.writeUTF('size'); out.writeByte(3); out.writeInt(3)
                    out.writeInt(12); out.writeInt(10); out.writeInt(12)
                    out.writeByte(9); out.writeUTF('palette'); out.writeByte(10); out.writeInt(1)
                    out.writeByte(8); out.writeUTF('Name'); out.writeUTF('minecraft:air'); out.writeByte(0)
                    out.writeByte(9); out.writeUTF('blocks'); out.writeByte(10); out.writeInt(0)
                    out.writeByte(9); out.writeUTF('entities'); out.writeByte(10); out.writeInt(0)
                    out.writeByte(0)
                }
            }
        }
        tasks.named('processResources') { dependsOn('generateNanotechFixture') }
        neoForge.runs.gameTestServer.gameDirectory = new File(directory, 'runtime')
        neoForge.runs.gameTestServer.systemProperty('neoforge.enabledGameTestNamespaces', 'racmc_nanotech')
    }
}
